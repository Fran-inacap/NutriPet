<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{{ accion }} Registro - NutriPet</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background-color: #f9f9f9; }
        .card { background: white; padding: 20px; border-radius: 8px; width: 400px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .field { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 8px; box-sizing: border-box; }
        .error { color: red; margin-bottom: 15px; }
        .btn { padding: 8px 15px; background: #2b6cb0; color: white; border: none; border-radius: 4px; cursor: pointer; }
        a { color: #666; text-decoration: none; margin-left: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>{{ accion }} Registro de Mascota</h2>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        
        <form method="POST">
            {% csrf_token %}
            <div class="field">
                <label>Nombre de la Mascota:</label>
                <input type="text" name="nombre" value="{{ registro.nombre|default:'' }}" required>
            </div>
            <div class="field">
                <label>Especie:</label>
                <select name="especie" required>
                    <option value="perro" {% if registro.especie == 'perro' %}selected{% endif %}>Perro</option>
                    <option value="gato" {% if registro.especie == 'gato' %}selected{% endif %}>Gato</option>
                    <option value="otra" {% if registro.especie == 'otra' %}selected{% endif %}>Otra especie</option>
                </select>
            </div>
            <div class="field">
                <label>Edad (Años):</label>
                <input type="number" name="edad" value="{{ registro.edad|default:'' }}" required>
            </div>
            <div class="field">
                <label>Alérgeno (opcional):</label>
                <input type="text" name="alergeno" value="{{ registro.alergeno|default:'' }}">
            </div>
            <button type="submit" class="btn">Guardar y Evaluar</button>
            <a href="{% url 'lista' %}">Cancelar</a>
        </form>
    </div>
</body>
</html>
